[package]
name = "geohueo"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "IP geolocation lookup via configurable providers"
license = "MIT"
repository = "https://github.com/sesav/geohueo"
readme = "README.md"
keywords = ["geoip", "geolocation", "ip", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/examples/**",
]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8.23"
ureq = { version = "3.5.0", features = ["json"] }
url = "=2.5.8"
