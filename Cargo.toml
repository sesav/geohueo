[package]
name = "geolkp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "IP geolocation lookup via geoiplookup.io"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
